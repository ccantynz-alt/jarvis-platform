# Bound each service's memory so one leak/runaway can't swap-thrash the box.
# Generous ceilings on services that spawn child processes (claude workers,
# chromium, the claude classifier) which share the service cgroup.
[Service]
# 1536M → 2560M on 2026-07-30, measured not guessed: a cold
# `turbo run typecheck --force` in /opt/alecrae exits 137 (OOM) under 1536M and
# exits 0 under 2G, so this is ~25% headroom over the real requirement. The box has
# 7.9G total and 4.9G available, and this is a ceiling rather than a reservation.
# The trigger was AlecRae's audit running for the first time ever after its path
# was corrected — it OOM-killed jarvis-audit 72 seconds in.
MemoryMax=2560M
MemorySwapMax=256M
