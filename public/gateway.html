<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marco">
<meta name="theme-color" content="#06090f">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>MARCO</title>
<style>
  :root {
    --bg: #06090f; --panel: #0b1220; --panel2: #101a2e; --line: #1b2a45;
    --text: #d7e2f4; --dim: #6b7f9e; --accent: #37b7ff; --accent2: #7ef0c0;
    --warn: #ffcc66; --alert: #ff6b7a; --user: #16283f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, "SF Pro Text", Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* Scene experiments (video avatar, orb) removed 2026-07-10 — clean UI won.
     The embodied Jarvis is roadmap move 21, to be done properly. */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: #0b1220cc; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .logo { font-weight: 800; letter-spacing: .18em; font-size: 15px; color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--alert); transition: background .3s; }
  .dot.on { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  header .spacer { flex: 1; }
  .hbtn {
    position: relative; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer;
  }
  .hbtn.active { border-color: var(--accent); color: var(--accent); }
  #inboxBadge {
    position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px;
    background: var(--alert); color: #fff; font-size: 11px; font-weight: 700;
    display: none; align-items: center; justify-content: center; padding: 0 5px;
  }
  #transcript { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #16283fd9; border: 1px solid #23405f; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .msg.jarvis { align-self: flex-start; background: #101a2ed9; border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .msg.jarvis.interim { opacity: .8; }
  .msg .meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .msg.notify { align-self: stretch; max-width: none; background: #101d16; border: 1px solid #1e4635; }
  .msg.notify.warn { background: #201a0e; border-color: #4d3d1a; }
  .msg.notify.alert { background: #241014; border-color: #5c2430; }
  footer { border-top: 1px solid var(--line); background: #0b1220cc;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 12px 14px; }
  .inputrow { display: flex; gap: 10px; align-items: center; }
  #textIn {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); padding: 12px 14px; font-size: 16px; outline: none;
  }
  #textIn:focus { border-color: var(--accent); }
  #micBtn {
    width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent);
    background: radial-gradient(circle at 35% 30%, #123, #0a1524); color: var(--accent);
    font-size: 26px; cursor: pointer; flex: none; transition: all .15s;
  }
  #micBtn.listening {
    background: radial-gradient(circle at 35% 30%, #ff5f6d33, #2a0f16);
    border-color: var(--alert); color: var(--alert); animation: pulse 1.2s infinite;
  }
  #micBtn:disabled { opacity: .35; border-color: var(--dim); color: var(--dim); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #ff6b7a44; } 50% { box-shadow: 0 0 0 14px #ff6b7a00; } }
  #hint { text-align: center; color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 15px; }
  #sendBtn { border: 1px solid var(--line); background: var(--panel2); color: var(--accent);
    border-radius: 12px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
  /* Drawer overlays (Inbox, Roadmap) */
  .drawer-overlay {
    position: fixed; inset: 0; background: #04070ccc; display: none; z-index: 40;
  }
  .drawer-overlay.open { display: block; }
  #inboxPanel {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92vw);
    background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  }
  #inboxPanel h2 { font-size: 14px; letter-spacing: .12em; color: var(--accent);
    padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  #inboxPanel h2 .spacer { flex: 1; }
  #inboxList { flex: 1; overflow-y: auto; }
  .nitem { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .nitem.unread { background: #0e1930; border-left: 3px solid var(--accent); }
  .nitem .t { font-weight: 600; font-size: 14px; }
  .nitem .b { color: var(--dim); font-size: 13px; margin-top: 3px; white-space: pre-wrap; }
  .nitem .ts { color: var(--dim); font-size: 11px; margin-top: 4px; }

  /* Roadmap drawer */
  #roadmapPanel { position: absolute; right: 0; top: 0; bottom: 0; width: min(460px, 92vw);
    background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  #roadmapPanel h2 { font-size: 14px; letter-spacing: .12em; color: var(--accent);
    padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  #roadmapPanel h2 .spacer { flex: 1; }
  #roadmapBody { flex: 1; overflow-y: auto; padding: 20px 16px 30px; }
  .rm-hero { text-align: center; padding: 6px 0 22px; }
  .rm-pct { font-size: 44px; font-weight: 800; color: var(--accent2); letter-spacing: -.02em; }
  .rm-sub { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .rm-bar { height: 10px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line);
    overflow: hidden; margin-top: 16px; }
  .rm-bar-fill { height: 100%; width: 0%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 1.1s cubic-bezier(.16,1,.3,1); }
  .rm-current { margin-top: 14px; font-size: 13px; color: var(--warn);
    background: #1a1608; border: 1px solid #4d3d1a; border-radius: 10px; padding: 8px 12px; }
  .rm-phase { margin-top: 6px; }
  .rm-phase summary { cursor: pointer; list-style: none; padding: 12px 0; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
  .rm-phase summary::-webkit-details-marker { display: none; }
  .rm-phase summary .car { color: var(--dim); font-size: 11px; transition: transform .2s; }
  .rm-phase[open] summary .car { transform: rotate(90deg); }
  .rm-phase summary .rp-name { flex: 1; }
  .rm-phase summary .rp-count { color: var(--dim); font-size: 12px; font-weight: 400; }
  .rm-move { display: flex; gap: 10px; padding: 9px 4px 9px 22px; font-size: 13px; align-items: flex-start; }
  .rm-move .icon { flex: none; font-size: 14px; margin-top: 1px; }
  .rm-move .body .title { color: var(--text); }
  .rm-move.done .title { color: var(--dim); text-decoration: line-through; text-decoration-color: #2a3a52; }
  .rm-move .body .note { color: var(--dim); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body data-jstate="idle">
<header>
  <span class="dot" id="connDot"></span>
  <span class="logo">MARCO</span>
  <span class="spacer"></span>
  <button class="hbtn" id="muteBtn" title="Toggle speech">🔊</button>
  <button class="hbtn" id="convBtn" title="Hands-free conversation">💬</button>
  <button class="hbtn" id="roadmapBtn">Roadmap</button>
  <button class="hbtn" id="inboxBtn">Inbox<span id="inboxBadge"></span></button>
</header>

<div id="transcript"></div>

<footer>
  <div class="inputrow">
    <button id="micBtn" title="Push to talk">🎙</button>
    <input id="textIn" type="text" placeholder="Talk or type to Marco…" autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
  <div id="hint"></div>
</footer>

<div id="inbox" class="drawer-overlay">
  <div id="inboxPanel">
    <h2>NOTIFICATIONS <span class="spacer"></span>
      <button class="hbtn" id="readAllBtn">Mark all read</button>
      <button class="hbtn" id="closeInbox" style="margin-left:8px">✕</button>
    </h2>
    <div id="inboxList"></div>
  </div>
</div>

<div id="roadmap" class="drawer-overlay">
  <div id="roadmapPanel">
    <h2>MARCO ROADMAP <span class="spacer"></span>
      <button class="hbtn" id="closeRoadmap">✕</button>
    </h2>
    <div id="roadmapBody">
      <div class="rm-hero">
        <div class="rm-pct" id="rmPct">–</div>
        <div class="rm-sub" id="rmSub">loading…</div>
        <div class="rm-bar"><div class="rm-bar-fill" id="rmBarFill"></div></div>
      </div>
      <div id="rmCurrentWrap"></div>
      <div id="rmPhases"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const transcript = $('transcript'), hint = $('hint');

  // ── Mute / TTS ─────────────────────────────────────────────────────────────
  let muted = localStorage.getItem('jarvis_muted') === '1';
  let ttsPrimed = false;
  const muteBtn = $('muteBtn');
  const renderMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.classList.toggle('active', !muted); };
  renderMute();
  muteBtn.onclick = () => {
    muted = !muted; localStorage.setItem('jarvis_muted', muted ? '1' : '0'); renderMute();
    if (muted) { bargeCancel = true; speechSynthesis.cancel(); document.body.dataset.jstate = 'idle'; }
    else { ttsPrimed = true; speak('Marco voice is on.'); } // in-gesture speech: unlocks iOS audio + audible device test
  };

  // iOS quirk: getVoices() is empty until voiceschanged fires — cache when ready.
  let voiceCache = [];
  const loadVoices = () => { const v = speechSynthesis.getVoices(); if (v && v.length) voiceCache = v; };
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

  function primeTTS() { // iOS: speech must be unlocked by a user gesture
    if (ttsPrimed || !('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); ttsPrimed = true;
  }
  function setJState(s) { document.body.dataset.jstate = s; }

  // ── Interrupting Jarvis (2026-07-26) ────────────────────────────────────────
  // This page had NO way to stop him mid-sentence: muting only silenced FUTURE
  // replies, and the mic never reopened until he finished (scheduleRelisten is
  // called only from speak's onend). The Command Deck has had a STOP bar and an
  // Escape binding for days; the Gateway never got them.
  //
  // Deliberately NOT acoustic. A mic-tap energy VAD was tried and reverted the
  // same day: echo cancellation attenuates the mic hardest during double-talk
  // (exactly when barge-in must fire), on iOS a second getUserMedia
  // permanently mutes the first (WebKit #179363) which SpeechRecognition would
  // trigger, and pausing audio while recognition runs can kill it with no
  // error event — so one false positive could leave the ear deaf with no way
  // to notice. These two routes carry none of that risk and always work.
  let bargeCancel = false; // cancel() fires the utterance's onerror asynchronously, not onend —
                           // this flag lets that handler tell "user cut him off" from a real error
  function bargeIn() {
    if (document.body.dataset.jstate !== 'speaking' && !speechSynthesis.speaking) return false;
    bargeCancel = true;
    speechSynthesis.cancel();
    markSpeechEnded(); // a cut-off utterance still leaves sound in the room
    setJState('idle');
    hint.textContent = '';
    if (conversationMode && !listening) scheduleRelisten();
    return true;
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') bargeIn(); });

  const stopBar = document.createElement('div');
  stopBar.textContent = '◼ STOP — tap or press Esc';
  stopBar.style.cssText = 'position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:60;display:none;' +
    'padding:10px 20px;border:1px solid #ff4d6a;border-radius:8px;color:#ff4d6a;background:rgba(20,4,10,.9);' +
    'font:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;user-select:none';
  stopBar.onclick = bargeIn;
  document.body.appendChild(stopBar);
  setInterval(() => {
    stopBar.style.display = (document.body.dataset.jstate === 'speaking' || speechSynthesis.speaking) ? 'block' : 'none';
  }, 300);

  function speak(text) {
    if (muted || !text || !('speechSynthesis' in window)) return;
    // Every new utterance starts with a clean flag. Without this, a bargeIn()
    // or mute that fired when nothing was actually speaking leaves bargeCancel
    // stuck true, and the next GENUINE voice error gets silently swallowed as
    // if it were a deliberate interrupt. Bounds staleness to one utterance.
    bargeCancel = false;
    lastSpokenText = text; // compared against the next utterance to catch speaker bleed
    // Belt and braces: never begin speaking while the mic is live, whatever
    // path got us here. This is the rule the text filter was standing in for.
    abortListening();
    const gen = ++speakGen; // a cancelled utterance must not reopen the ear
    speechSynthesis.cancel(); // iOS wedges when utterances queue — always start fresh
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 0.85; u.volume = 1; // measured, slightly deep — closest browser TTS gets to a Jarvis timbre
    // Free British male voices, best-first across the platforms Craig uses:
    // Chrome desktop ("Google UK English Male" — the one he asked for by
    // memory), Windows/Edge (Ryan/George/Thomas), then Apple's British males
    // (Daniel is the classic butler voice on iPad). Enhanced/premium/natural
    // variants win when installed. Kept in step with command-deck.html's
    // pickBritishMaleVoice() — same list, same order, same \bmale\b rule:
    // /male/ matches "Female" as a substring, which silently picked the wrong
    // voice on desktop (2026-08-11).
    const prefer = ['google uk english male', 'microsoft ryan', 'microsoft george',
      'microsoft thomas', 'daniel', 'arthur', 'oliver', 'jamie'];
    u.voice = prefer.map(n => voiceCache.find(v => v.name.toLowerCase().includes(n) && /premium|enhanced|natural/i.test(v.name)))
        .find(Boolean)
      || prefer.map(n => voiceCache.find(v => v.name.toLowerCase().includes(n))).find(Boolean)
      || voiceCache.find(v => /en[-_]GB/i.test(v.lang) && /\bmale\b/i.test(v.name))
      || voiceCache.find(v => /en[-_]GB/i.test(v.lang))
      || voiceCache.find(v => /en[-_](AU|NZ)/i.test(v.lang))
      || voiceCache.find(v => /^en/i.test(v.lang)) || null;
    u.onstart = () => { setJState('speaking'); hint.textContent = '🔈 speaking…'; };
    u.onend = () => {
      markSpeechEnded();
      if (gen !== speakGen) return; // superseded by the next part of the same answer
      replyPending(false);
      setJState('idle');
      if (hint.textContent.startsWith('🔈')) hint.textContent = '';
      if (conversationMode) scheduleRelisten();
    };
    u.onerror = (e) => {
      markSpeechEnded();
      if (gen !== speakGen) return; // cancelled to make way for the next utterance
      replyPending(false);
      setJState('idle');
      if (bargeCancel) { bargeCancel = false; hint.textContent = ''; if (conversationMode && !listening) scheduleRelisten(); return; }
      hint.textContent = `⚠ voice error: ${e.error || 'unknown'}`;
    };
    speechSynthesis.speak(u);
  }

  // ── Transcript rendering ───────────────────────────────────────────────────
  function bubble(cls, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
    return div;
  }
  function meta(div, s) {
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = s; div.appendChild(m);
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws, streamDiv = null, reconnectDelay = 1000;
  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { $('connDot').classList.add('on'); hint.textContent = ''; reconnectDelay = 1000; };
    ws.onclose = () => {
      $('connDot').classList.remove('on');
      hint.textContent = 'reconnecting…';
      setTimeout(connect, reconnectDelay = Math.min(reconnectDelay * 2, 15000));
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'reply') {
        const div = bubble('jarvis' + (m.interim ? ' interim' : ''), m.text || '');
        if (!m.interim && m.intent) meta(div, `${m.intent} · ${m.via} · ${m.ms}ms`);
        speak(m.speech);
        if (!m.interim && muted) { replyPending(false); scheduleRelisten(); } // muted → no TTS onend to drive the loop
      } else if (m.type === 'reply_chunk') {
        if (!streamDiv) streamDiv = bubble('jarvis', '');
        streamDiv.textContent += m.text;
        transcript.scrollTop = transcript.scrollHeight;
      } else if (m.type === 'reply_done') {
        if (streamDiv) { meta(streamDiv, `${m.via || 'converse'} · ${m.ms}ms`); }
        speak(m.speech); streamDiv = null;
        if (muted) { replyPending(false); scheduleRelisten(); }
      } else if (m.type === 'notify') {
        const n = m.notification;
        bubble('notify ' + (n.level || 'info'), `${n.title}${n.body && n.body !== n.title ? '\n' + n.body : ''}`);
        // Notifications render silently here — the Command Deck (:8444) is the
        // one voice of Jarvis now; two apps must never speak the same alert.
        refreshInbox();
      } else if (m.type === 'job_update') {
        const j = m.payload;
        bubble('notify ' + (j.status === 'completed' ? 'info' : 'warn'), `Job ${String(j.id).slice(0,8)} on ${j.platform}: ${j.status}`);
      }
    };
  }
  connect();

  // ── Sending ────────────────────────────────────────────────────────────────
  function send(text) {
    text = (text || '').trim();
    if (!text || !ws || ws.readyState !== 1) return;
    bubble('user', text);
    // Shut the ear NOW. The reply lands seconds later and starts speaking; if
    // an idle relisten reopened the mic in that gap, Jarvis talks into it.
    replyPending(true);
    abortListening();
    ws.send(JSON.stringify({ type: 'utterance', text, mode: 'auto' }));
  }
  $('sendBtn').onclick = () => { primeTTS(); send($('textIn').value); $('textIn').value = ''; };
  $('textIn').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { primeTTS(); send($('textIn').value); $('textIn').value = ''; }
  });

  // ── Voice — push-to-talk + hands-free conversation loop ─────────────────────
  // Push-to-talk: tap mic → one utterance. Conversation mode (💬): after Jarvis
  // finishes speaking, the mic auto-reopens for the next turn — tap once, then
  // talk back and forth. iOS grants the mic only to a foreground tab, so this is
  // hands-free with the app open (the phone-call path is the eyes-free story).
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = $('micBtn'), convBtn = $('convBtn');
  let conversationMode = false, rec = null, listening = false, relistenTimer = null;

  // ── Echo guard (2026-07-28) ─────────────────────────────────────────────────
  // Craig: "its continuous breaking, echoing and looping". The Command Deck was
  // hardened against this on 2026-07-26; the Gateway — the interface he
  // actually talks to — never got any of it. Same gap as the transcript.
  //
  // The Gateway's ear is already shut while Jarvis talks (one-shot recognition,
  // reopened only from speak's onend), so the exposure is narrower than the
  // deck's was: it's the ACOUSTIC TAIL. speechSynthesis fires onend when it
  // believes it has finished, but speaker reverb and Bluetooth latency mean
  // sound is still in the room — the mic reopened 400ms later and transcribed
  // the last words of Jarvis's own reply as Craig's next utterance, which went
  // straight to the brain and started the loop.
  //
  // Two backstops, deliberately conservative, because the 2026-07-26 transcript
  // showed the OPPOSITE failure too: Craig's real speech arrived FUSED with the
  // echo in one utterance and a 60% word-overlap filter binned the whole thing,
  // discarding his actual opinion. So this only discards an utterance that is
  // OVERWHELMINGLY his own words (80%) and arrives inside the tail window.
  // Anything else gets through, even if it carries some echo.
  const MIC_COOLDOWN_MS = 600;   // matches the deck
  const ECHO_WINDOW_MS  = 2500;  // beyond this, treat speech as genuinely Craig's
  const ECHO_RATIO      = 0.8;
  const ECHO_MIN_WORDS  = 4;     // below this, ALWAYS send — see below
  let lastSpeechEndAt = 0, lastSpokenText = '';

  // ── The structural fix (2026-07-28, second pass) ────────────────────────────
  // Two rounds of tuning the text filter did not stop the loop, which is the
  // lesson the deck already wrote down on 2026-07-26: "an open mic pointed at a
  // speaker cannot be fixed with a text-similarity heuristic; the only reliable
  // cure is not to listen while talking." The filter was treating a symptom.
  //
  // The hole: the ear was only shut while SPEAKING, not while a reply was in
  // FLIGHT. Sequence that loops — recognition ends with no result (silence),
  // conversation mode relistens 600ms later, and the reply Craig asked for
  // arrives a few seconds after that and starts speaking straight into a live
  // mic. Nothing in startListening could know a reply was coming.
  //
  // Worse, every speak() calls speechSynthesis.cancel() first, so an interim
  // reply's utterance fires its onend when the next one cancels it — and that
  // onend called scheduleRelisten(), opening the mic in the gap between two
  // parts of the SAME answer.
  //
  // So: the ear is shut from the moment Craig's words are sent until Jarvis has
  // finished speaking and the acoustic tail has passed, and only the newest
  // utterance is allowed to reopen it.
  let awaitingReply = false;   // sent, no final reply yet — the mic stays shut
  let speakGen = 0;            // cancelled utterances must not drive the loop
  let micAborted = false;      // distinguishes our own abort() from a real end
  let replyWatchdog = null;    // never let a lost reply deafen hands-free forever

  function abortListening() {
    clearTimeout(relistenTimer);
    if (rec && listening) { micAborted = true; try { rec.abort(); } catch {} }
  }

  // A reply that never arrives (dropped socket, wedged brain) must not leave the
  // ear shut forever — that is indistinguishable from a broken assistant.
  function replyPending(on) {
    awaitingReply = on;
    clearTimeout(replyWatchdog);
    if (on) {
      replyWatchdog = setTimeout(() => {
        if (!awaitingReply) return;
        console.warn('[voice] no reply within 60s — reopening the ear');
        awaitingReply = false;
        hint.textContent = 'no answer came back — listening again';
        if (conversationMode) scheduleRelisten();
      }, 60000);
    }
  }

  function markSpeechEnded() { lastSpeechEndAt = Date.now(); }

  const echoWords = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);

  // A real echo is Jarvis's own words, in Jarvis's own order. That is the test
  // — NOT bag-of-words overlap.
  //
  // The first version of this used `spoken.includes(word)` over the whole
  // reply, which is a SUBSTRING check: "rest" matched "restarted", "the"
  // matched "there". With no minimum length, a short command built from common
  // words scored 100% and was dropped in silence. "and the rest" never reached
  // the brain. Craig, 2026-07-28: "its listening now and not talking back i
  // dont know if its working." A filter that can silently eat real speech is
  // worse than the echo it prevents.
  //
  // Two changes make it safe: whole-word comparison against a CONTIGUOUS run
  // of the reply (coincidental overlap doesn't line up in order), and a hard
  // floor — anything under ECHO_MIN_WORDS is always sent, because "yes",
  // "stop" and "do it" must never be swallowed.
  function isSelfEcho(said) {
    if (!lastSpokenText) return false;
    if (Date.now() - lastSpeechEndAt > ECHO_WINDOW_MS) return false;
    const heard = echoWords(said);
    const spoken = echoWords(lastSpokenText);
    if (heard.length < ECHO_MIN_WORDS || !spoken.length) return false;
    let best = 0;
    for (let i = 0; i < spoken.length; i++) {
      let hits = 0;
      for (let j = 0; j < heard.length; j++) if (spoken[i + j] === heard[j]) hits++;
      if (hits > best) best = hits;
    }
    return best / heard.length >= ECHO_RATIO;
  }

  // userGesture=true means Craig tapped the mic or turned on hands-free — that
  // is a deliberate barge-in and always wins. An automatic relisten must never
  // cut Jarvis off or open the mic into his own voice.
  function startListening(userGesture = false) {
    if (!SR || listening) return;
    if (!userGesture) {
      // Reschedule, never return dead: an early `return` here left conversation
      // mode silently switched off with no way for Craig to tell.
      if (awaitingReply) return scheduleRelisten();
      if (document.body.dataset.jstate === 'speaking' || speechSynthesis.speaking) return scheduleRelisten();
      if (Date.now() - lastSpeechEndAt < MIC_COOLDOWN_MS) return scheduleRelisten();
    }
    speechSynthesis.cancel();
    micAborted = false;
    rec = new SR();
    rec.lang = 'en-NZ'; rec.interimResults = true; rec.continuous = false;
    let finalText = '';
    rec.onstart = () => { listening = true; micBtn.classList.add('listening'); hint.textContent = 'listening…'; setJState('listening'); };
    rec.onresult = (e) => {
      let interim = '';
      for (const r of e.results) (r.isFinal ? (finalText += r[0].transcript) : (interim += r[0].transcript));
      hint.textContent = interim || finalText || 'listening…';
    };
    rec.onerror = (e) => {
      if (e.error === 'no-speech') return; // handled in onend (may relisten)
      hint.textContent = e.error === 'not-allowed' ? '⚠ Mic permission denied — check Safari settings' : `voice error: ${e.error}`;
      if (e.error === 'not-allowed') setConversation(false);
    };
    rec.onend = () => {
      listening = false; micBtn.classList.remove('listening');
      if (micAborted) { micAborted = false; return; } // we closed it deliberately
      setJState('idle');
      const said = finalText.trim();
      if (said && isSelfEcho(said)) {
        // His own voice off the speaker tail — never send it to the brain,
        // that is how the loop started. But SAY SO: a silent drop is
        // indistinguishable from Jarvis being broken, which is exactly how the
        // first version of this filter cost an evening. If Craig sees this
        // line when he actually spoke, the filter is wrong and he can tell.
        console.warn('[voice] ignored as self-echo:', said);
        hint.textContent = '🔇 ignored an echo of my own reply — say again if that was you';
        if (conversationMode) scheduleRelisten();
      }
      else if (said) { hint.textContent = ''; send(said); } // relisten happens after Jarvis replies (speak.onend)
      else if (conversationMode) { hint.textContent = 'say something…'; scheduleRelisten(); }
      else if (!hint.textContent.startsWith('⚠')) hint.textContent = '';
    };
    try { rec.start(); } catch { /* rapid restart can race — ignore */ }
  }

  // Re-open the mic a beat after Jarvis stops talking (called from speak.onend).
  // The wait is now at least the acoustic-tail cooldown, not a flat 400ms —
  // reopening before the room goes quiet is what fed his own voice back in.
  function scheduleRelisten() {
    if (!conversationMode) return;
    clearTimeout(relistenTimer);
    const wait = Math.max(400, MIC_COOLDOWN_MS - (Date.now() - lastSpeechEndAt));
    relistenTimer = setTimeout(() => { if (conversationMode && !listening) startListening(false); }, wait);
  }

  function setConversation(on) {
    conversationMode = on;
    convBtn.classList.toggle('active', on);
    if (on) { primeTTS(); hint.textContent = 'hands-free on — tap 💬 to stop'; if (!listening) startListening(true); }
    else { clearTimeout(relistenTimer); hint.textContent = ''; if (listening) rec?.stop(); }
  }

  if (!SR) {
    micBtn.disabled = true; convBtn.disabled = true;
    hint.textContent = location.protocol === 'https:'
      ? 'Voice not supported in this browser — use the text box'
      : '⚠ Voice needs the https ts.net address, not http';
  } else {
    micBtn.onclick = () => { primeTTS(); if (listening) rec?.stop(); else startListening(true); };
    convBtn.onclick = () => setConversation(!conversationMode);
  }

  // ── Inbox ──────────────────────────────────────────────────────────────────
  const badge = $('inboxBadge');
  async function refreshInbox(render = false) {
    try {
      const d = await fetch('/api/inbox').then(r => r.json());
      badge.style.display = d.unread ? 'flex' : 'none';
      badge.textContent = d.unread;
      if (render) {
        const list = $('inboxList'); list.innerHTML = '';
        for (const n of d.notifications || []) {
          const div = document.createElement('div');
          div.className = 'nitem' + (n.read_at ? '' : ' unread');
          div.innerHTML = `<div class="t"></div><div class="b"></div><div class="ts"></div>`;
          div.querySelector('.t').textContent = n.title;
          div.querySelector('.b').textContent = n.body && n.body !== n.title ? n.body : '';
          div.querySelector('.ts').textContent = `${n.source} · ${new Date(n.ts).toLocaleString()}`;
          div.onclick = async () => {
            if (!n.read_at) { await fetch(`/api/inbox/${n.id}/read`, { method: 'POST' }); refreshInbox(true); }
          };
          list.appendChild(div);
        }
      }
    } catch { /* offline */ }
  }
  $('inboxBtn').onclick = () => { $('inbox').classList.add('open'); refreshInbox(true); };
  $('closeInbox').onclick = () => $('inbox').classList.remove('open');
  $('inbox').onclick = (e) => { if (e.target.id === 'inbox') $('inbox').classList.remove('open'); };
  $('readAllBtn').onclick = async () => { await fetch('/api/inbox/all/read', { method: 'POST' }); refreshInbox(true); };
  refreshInbox();
  setInterval(() => refreshInbox(false), 60000);

  // ── Roadmap ("are we done yet") ───────────────────────────────────────────
  const ICONS = { done: '✅', in_progress: '🔨', superseded: '➖', pending: '⬜' };
  async function loadRoadmapPanel() {
    $('rmBarFill').style.width = '0%';
    try {
      const d = await fetch('/api/roadmap').then(r => r.json());
      $('rmSub').textContent = `${d.doneCount} of ${d.totalCount} moves shipped`;
      $('rmCurrentWrap').innerHTML = d.current
        ? `<div class="rm-current">🔨 Currently: ${d.current.title} <span style="opacity:.7">(${d.current.phase})</span></div>` : '';
      const phasesEl = $('rmPhases');
      phasesEl.innerHTML = '';
      d.phases.forEach((phase, i) => {
        const doneInPhase = phase.moves.filter(m => m.status === 'done').length;
        const det = document.createElement('details');
        det.className = 'rm-phase';
        det.open = phase.moves.some(m => m.status === 'in_progress') || i === 0;
        const moves = phase.moves.map(m => `
          <div class="rm-move ${m.status === 'done' ? 'done' : ''}">
            <span class="icon">${ICONS[m.status] || '⬜'}</span>
            <div class="body"><div class="title"></div>${m.note ? '<div class="note"></div>' : ''}</div>
          </div>`).join('');
        det.innerHTML = `<summary><span class="car">▶</span><span class="rp-name">${phase.name}</span><span class="rp-count">${doneInPhase}/${phase.moves.length}</span></summary>${moves}`;
        // text content set via textContent to avoid any HTML injection from config
        det.querySelectorAll('.rm-move').forEach((el, idx) => {
          el.querySelector('.title').textContent = phase.moves[idx].title;
          const noteEl = el.querySelector('.note');
          if (noteEl) noteEl.textContent = phase.moves[idx].note;
        });
        phasesEl.appendChild(det);
      });
      requestAnimationFrame(() => { $('rmPct').textContent = d.percent + '%'; $('rmBarFill').style.width = d.percent + '%'; });
    } catch {
      $('rmSub').textContent = 'unavailable';
    }
  }
  $('roadmapBtn').onclick = () => { $('roadmap').classList.add('open'); loadRoadmapPanel(); };
  $('closeRoadmap').onclick = () => $('roadmap').classList.remove('open');
  $('roadmap').onclick = (e) => { if (e.target.id === 'roadmap') $('roadmap').classList.remove('open'); };

  bubble('jarvis', 'Jarvis online. Tap 🎙 and just talk — ask me anything or tell me to sort something out. Tap 💬 for hands-free back-and-forth.');
})();
</script>
</body>
</html>
